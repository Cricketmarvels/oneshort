# Local full stack: MongoDB 8 (single-node replica set, required for transactions) + API + web.
#   docker compose up --build
#   docker compose exec api python -m scripts.seed_data --reset   (dev only; needs APP_ENV=development)
services:
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20

  api:
    build: ./backend
    env_file: ./backend/.env.example
    environment:
      APP_ENV: development
      DEBUG: "false"
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      PUBLIC_BASE_URL: http://localhost:8080
      CORS_ORIGINS: '["http://localhost:8080"]'
      FORWARDED_ALLOW_IPS: "*"   # compose network only; in production set this to the proxy's IP/CIDR
    depends_on:
      mongo: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes: [uploads:/app/uploads]

  web:
    build: { context: ., dockerfile: frontend/Dockerfile }
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  mongo-data:
  uploads:
