[project]
name = "cricket-platform-api"
version = "0.1.0"
description = "Hyperlocal Cricket Matchmaking & Team Management Platform - API"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pymongo>=4.10",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "python-multipart>=0.0.12",
  "email-validator>=2.2",
  "structlog>=24.4",
  "anthropic>=2.4.0",
  "pillow>=11",
  "sentry-sdk[fastapi]>=2.20",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "asgi-lifespan>=2.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "E501"]
"scripts/**" = ["S311", "E501"]
